name: Publicar na Play Store

# Gera o .aab assinado e envia para a trilha "interno" da Play Console.
# Rode com uma tag (git tag v1.0.0 && git push origin v1.0.0) ou manualmente.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Trilha da Play (internal, alpha, beta, production)'
        default: internal

jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      # vazio até o segredo existir: aí o job só gera o .aab, sem enviar
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Recuperar chave de upload
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Segredo ANDROID_KEYSTORE_BASE64 ausente"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lembra.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Versão a partir da tag
        run: |
          # código acima dos do APK de testes, para a Play nunca recusar por versão repetida
          echo "VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi

      - name: Compilar AAB assinado
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lembra.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: lembra-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Enviar para a Play Console
        if: ${{ env.PLAY_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.dottoleao.lembra
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          # enquanto o app não passou pela primeira revisão, a Play só aceita rascunho
          status: draft
